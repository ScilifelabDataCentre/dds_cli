# Fork-only: build PyInstaller binaries with a custom default API base (no PyPI / TestPyPI).
# Set workflow input "api_base_url" when running manually, or configure repo Variables
# FORK_DDS_API_BASE_URL and optionally FORK_DDS_PUBLIC_URL.
# Binaries are published as GitHub Release assets (public download URLs on the Releases page).
name: Build fork binaries

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Default API base baked into the binary (e.g. https://your-host.example/api/v1)"
        required: false
        default: ""
      public_url:
        description: "Optional __url__ / homepage string (default derived from api_base_url)"
        required: false
        default: ""
      release_tag:
        description: "GitHub release tag (default fork-binaries-<commit-sha>)"
        required: false
        default: ""
  push:
    branches:
      - dev
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.event_name == 'release' && github.event.release.tag_name || format('fork-binaries-{0}', github.sha) }}

jobs:
  binaries:
    # Intended for forks only (upstream already has release-cli.yml).
    if: github.repository != 'ScilifelabDataCentre/dds_cli'
    name: PyInstaller ${{ matrix.TARGET }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 / ubuntu-20.04 retired on GitHub-hosted runners; use current labels.
          - os: macos-latest
            TARGET: MacOs_arm64
            CMD_BUILD: >
              pyinstaller -F -c -n dds_cli_macos_arm64 -i resources/scilifelab.icns
              --exclude-module=tests --paths . --target-arch arm64 --log-level INFO .github/scripts/fork_entrypoint.py
            OUT_FILE_NAME: dds_cli_macos_arm64
          - os: macos-15-intel
            TARGET: MacOs_x86_64
            CMD_BUILD: >
              pyinstaller -F -c -n dds_cli_macos_x86_64 -i resources/scilifelab.icns
              --exclude-module=tests --paths . --target-arch x86_64 --log-level INFO .github/scripts/fork_entrypoint.py
            OUT_FILE_NAME: dds_cli_macos_x86_64
          - os: windows-latest
            TARGET: Windows_x86_64
            CMD_BUILD: >
              PyInstaller -F -c -n dds_cli_win_x86_64.exe -i resources/scilifelab.ico
              --exclude-module=tests --paths . --log-level INFO .github/scripts/fork_entrypoint.py
            OUT_FILE_NAME: dds_cli_win_x86_64.exe
          - os: ubuntu-24.04
            TARGET: Linux_x86_64
            CMD_BUILD: >
              pyinstaller -F -c -n dds_cli_ubuntu-24.04_x86_64 -i resources/scilifelab.icns
              --exclude-module=tests --paths . --target-arch x86_64 --log-level INFO .github/scripts/fork_entrypoint.py
            OUT_FILE_NAME: dds_cli_ubuntu-24.04_x86_64
          - os: ubuntu-22.04
            TARGET: Linux_x86_64
            CMD_BUILD: >
              pyinstaller -F -c -n dds_cli_ubuntu-22.04_x86_64 -i resources/scilifelab.icns
              --exclude-module=tests --paths . --target-arch x86_64 --log-level INFO .github/scripts/fork_entrypoint.py
            OUT_FILE_NAME: dds_cli_ubuntu-22.04_x86_64
          - os: ubuntu-latest
            TARGET: Linux_x86_64
            CMD_BUILD: >
              pyinstaller -F -c -n dds_cli_ubuntu-latest_x86_64 -i resources/scilifelab.icns
              --exclude-module=tests --paths . --target-arch x86_64 --log-level INFO .github/scripts/fork_entrypoint.py
            OUT_FILE_NAME: dds_cli_ubuntu-latest_x86_64

    steps:
      - uses: actions/checkout@v4

      - name: Configure endpoint patch env (inputs or repo Variables)
        run: |
          set -euo pipefail
          API="${{ inputs.api_base_url }}"
          PUB="${{ inputs.public_url }}"
          if [[ -z "${API}" ]]; then
            API="${{ vars.FORK_DDS_API_BASE_URL }}"
          fi
          if [[ -z "${PUB}" ]]; then
            PUB="${{ vars.FORK_DDS_PUBLIC_URL }}"
          fi
          if [[ -z "${API}" ]]; then
            echo "Set workflow_dispatch input api_base_url and/or repository variable FORK_DDS_API_BASE_URL."
            exit 1
          fi
          {
            echo "DDS_API_BASE=${API}"
            echo "DDS_PUBLIC_URL=${PUB}"
          } >> "${GITHUB_ENV}"

      - name: Patch default endpoints in working tree (not committed)
        run: python3 .github/scripts/patch_fork_endpoints.py

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyInstaller
          if [[ "${RUNNER_OS}" == "macOS" && "${RUNNER_ARCH}" == "X64" ]]; then
            # Fork-only: cryptography ships no Intel macOS wheels, so pip builds
            # it from source against Homebrew's OpenSSL. Linked dynamically, the
            # binary then loads the older libssl.3.dylib that PyInstaller bundles
            # from Python itself (same file name) and crashes with
            # "Symbol not found: _SSL_get0_group_name" (cryptography >= 50).
            # Link OpenSSL statically so the binary does not depend on it.
            OPENSSL_DIR="$(brew --prefix openssl@3)"
            test -f "${OPENSSL_DIR}/lib/libssl.a" && test -f "${OPENSSL_DIR}/lib/libcrypto.a"
            export OPENSSL_DIR
            export OPENSSL_STATIC=1
          fi
          pip install -r requirements.txt
          # Fork-only: not added to requirements.txt so that file stays
          # identical to upstream. Used by .github/scripts/fork_entrypoint.py
          # to make TLS verification independent of the certifi cacert.pem
          # PyInstaller extracts to a temp dir at runtime.
          pip install truststore

      - name: Check cryptography has OpenSSL linked statically (Intel macOS)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: |
          set -euo pipefail
          SO="$(python -c 'import cryptography.hazmat.bindings._rust as m; print(m.__file__)')"
          otool -L "${SO}"
          if otool -L "${SO}" | grep -E 'libssl|libcrypto'; then
            echo "::error::cryptography is dynamically linked to OpenSSL; the binary will crash."
            exit 1
          fi

      - name: Build with PyInstaller (${{ matrix.TARGET }})
        run: ${{ matrix.CMD_BUILD }}

      - name: Test executable
        run: "./dist/${{ matrix.OUT_FILE_NAME }} --version"

      - uses: actions/upload-artifact@v4
        with:
          name: dds-cli-${{ matrix.OUT_FILE_NAME }}
          path: dist/${{ matrix.OUT_FILE_NAME }}
          if-no-files-found: error

  release:
    if: github.repository != 'ScilifelabDataCentre/dds_cli'
    name: Publish GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: dds-cli-*
          merge-multiple: true
          path: dist

      - name: Create release and upload binaries
        run: |
          set -euo pipefail
          TAG="${{ env.RELEASE_TAG }}"
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --title "Fork binaries ${TAG}" \
              --prerelease \
              --generate-notes
          fi
          gh release upload "${TAG}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Epigenica fork: build and deploy CLI documentation to GitHub Pages.
# This is a fork-specific workflow that replaces docs-github-pages-cli.yml
# (kept disabled). Keeping a separate file means upstream changes to
# docs-github-pages-cli.yml never cause merge conflicts here.
#
# Uses only actions/* and github/* to comply with Epigenica's org action policy.
---
name: Epigenica Docs (GitHub Pages)
on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    name: Build and deploy CLI documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Sphinx and package
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential librsvg2-bin
          pip install --upgrade pip
          cat requirements.txt requirements-dev.txt > /tmp/docs-requirements.txt
          pip install -r /tmp/docs-requirements.txt
          pip install .

      - name: Build HTML documentation
        run: |
          cd docs
          make dirhtml

      - name: Deploy to gh-pages branch
        run: |
          cd docs/_build/dirhtml
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy docs from ${{ github.sha }}"
          git push --force \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git \
            gh-pages:gh-pages
